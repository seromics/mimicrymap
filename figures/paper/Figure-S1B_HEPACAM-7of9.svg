Library: Canonical Exposure</title><line x1="65.51682692307692" y1="268.8421052631579" x2="71.51682692307692" y2="230.84210526315792" stroke="#111111" stroke-width="0.6" stroke-opacity="0.65" /><text x="73.51682692307692" y="233.84210526315792" fill="#111111" font-size="9" font-weight="600">P03286</text></g></g><g transform="matrix(1.1764705882352942 0 0 1.1764705882352942 17.411764705882348 34.29411764705882)"><desc>Sequence map (Compact and Full exports): Shows where qualifying molecular mimicry matches occur along HEPACAM (416 residues). Color shows the number of window pairs at each target start; each residue takes the highest value among overlapping cores (0–2, displayed density color scale). Green and blue highlights mark the selected core and its surrounding context. Target coverage is the percentage of the full target sequence covered across the selected parent library. Coverage counts every position in a qualifying nine-residue core, including mismatches. Overlaps count once; context flanks are excluded. Parent tracks show matching positions, with opacity indicating core identity from 5/9 to 9/9. Blocks show sites revealed by the scanner; the coverage summary uses the complete result.

Parent versus target mimicry scatter: Each point pairs HEPACAM with one parent record in Curated Viral Proteomes (120) at ≥7/9 core identity; all 37 matching records are shown. The axes show covered residues as a percentage of full sequence length: HEPACAM on the X-axis and its paired parent on the Y-axis.</desc></g></svg>