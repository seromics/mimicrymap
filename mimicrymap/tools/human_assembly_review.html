</style></head><body>
<header><a href="ontology/index.html" style="float:right;color:var(--blue)">GO Ontology Atlas →</a><h1>Human Sequence Assembly</h1><p id="study"></p></header>
<div class="controls">
<label>View <select id="view"><option value="reference">Reference Sequence Families</option><option value="active">Study-Active Sequence Families</option><option value="patient">Sample-Active Examples</option><option value="ontology">Annotation Atlas</option></select></label>
<label>Assay <select id="assay"></select></label>
<label id="layer-label">Collection <select id="layer"></select></label>
<label>Samples <select id="scope"></select></label>
<label id="example-label">Sample <select id="example"></select></label>
<label><input id="compare" type="checkbox"> Compare</label><select id="scope2" aria-label="Second sample selection"></select>
</div>
<div class="controls">
<label id="weight-label">Sequence Link ≥ <select id="weight"><option value="0">All</option><option value="0.1" selected>0.10</option><option value="0.2">0.20</option><option value="0.4">0.40</option><option value="0.6">0.60</option><option value="0.8">0.80</option></select></label>
<label><input id="quiet" type="checkbox"> Show Quiet Families</label>
<label id="support-label"><input id="support" type="checkbox"> Sample BH &lt; 0.01 Only</label>
<label>Color Maximum <select id="color-max"><option value="0.05">5%</option><option value="0.1">10%</option><option value="0.25" selected>25%</option><option value="0.5">50%</option><option value="1">100%</option></select></label>

</div>

<div class="figure-wrap" id="figure"></div><div class="legend" id="legend"></div>
<div class="bottom"><section class="box"><h3 id="details-title">Family Inspector</h3><div id="details">Select a family or annotation to inspect its proteins and recorded antigen evidence.</div><ul id="search-results" class="search-results"></ul></section><section class="box"><h3 id="rank-title">Selected Evidence</h3><div id="ranking"></div></section></div>
</main>
<dialog id="methods-dialog"><button id="close-methods" style="float:right">Close</button><h2>Methods</h2><div id="methods-text"></div><p><a href="README.txt">Complete README &amp; Column Definitions</a></p></dialog>
<script src="review-data.js"></script>
<script>
const D=REVIEW_DATA,$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const S={selected:null,drill:null,rows:[],scopes:[],svg:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>x==null?'—':x<.0001?x.toExponential(2):x.toPrecision(3);
const assay=()=>D.assays[$('assay').value],isOnt=()=>$('view').value==='ontology';
function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text!=null)e.textContent=text;return e}
function text(g,x,y,value,size=13,attrs={}){const e=el('text',{x,y,fill:palette().ink,'font-family':'Arial, sans-serif','font-size':size,...attrs},value);g.append(e);return e}
function palette(){const s=getComputedStyle(document.body),get=k=>s.getPropertyValue('--'+k).trim();return Object.fromEntries(['bg','ink','muted','blue','teal','low','link'].map(k=>[k,get(k)]))}
function blend(a,b,t){let x=a.slice(1).match(/../g).map(v=>parseInt(v,16)),y=b.slice(1).match(/../g).map(v=>parseInt(v,16));return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function color(v){const p=palette();return blend(p.low,p.teal,Math.sqrt(Math.max(0,Math.min(1,v/Number($('color-max').value)))))}
function options(id,rows){$(id).replaceChildren(...rows.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o}))}
function buildScopes(){const a=assay(),groups=[...new Set(a.samples.map(s=>s.group))],visits=[...new Set(a.samples.map(s=>s.visit))];S.scopes=[{id:'all',label:'Whole Study',indices:a.samples.map((_,i)=>i)}];for(const g of groups){S.scopes.push({id:'g:'+g,label:g+' · All Visits',indices:a.samples.flatMap((s,i)=>s.group===g?[i]:[])});for(const v of visits)S.scopes.push({id:'gv:'+g+':'+v,label:g+' · '+v,indices:a.samples.flatMap((s,i)=>s.group===g&&s.visit===v?[i]:[])});}for(let i=0;i<a.samples.length;i++)S.scopes.push({id:'s:'+a.samples[i].id,label:a.samples[i].id,indices:[i]});for(const id of ['scope','scope2'])options(id,S.scopes.map(s=>[s.id,s.label]));$('scope').value=S.scopes.find(s=>s.id.startsWith('gv:'))?.id||'all';$('scope2').value=S.scopes.filter(s=>s.id.startsWith('gv:'))[2]?.id||'all';options('example',Object.keys(a.sample_views).map(s=>[s,s]));options('layer',Object.entries(a.annotations).map(([id,v])=>[id,v.label]));}
function currentView(){const a=assay();if(isOnt())return {id:$('layer').value,title:a.annotations[$('layer').value].label,nodes:a.annotations[$('layer').value].nodes,test:true};if($('view').value==='patient')return a.sample_views[$('example').value];return a.views.find(v=>v.id===$('view').value)}
function selectedScopes(){if($('view').value==='patient')return [S.scopes.find(s=>s.id==='s:'+$('example').value)];return [$('scope').value,...($('compare').checked?[$('scope2').value]:[])].map(id=>S.scopes.find(s=>s.id===id))}
function signal(node,indices){let h=0,n=0,rates=[],supported=0,eligible=0;for(const j of indices){h+=node.h[j];n+=node.n[j];if(node.n[j]>0)rates.push(node.h[j]/node.n[j]);if(node.q?.[j]!=null){eligible++;if(node.q[j]<.01)supported++;}}return {h,n,f:rates.length?rates.reduce((a,b)=>a+b,0)/rates.length:0,supported,eligible,q:indices.length===1?node.q?.[indices[0]]:null,p:indices.length===1?node.p?.[indices[0]]:null};}
function visible(node,indices){const d=signal(node,indices);return ($('quiet').checked||d.h>0)&&(!$('support').checked||!currentView().test||d.supported>0)}
function nodeTooltip(node,scope){const d=signal(node,scope.indices);return `${node.label}\n${node.proteins.length} reference proteins\n${d.h} hit / ${d.n} observed antigen–sample calls\nMean hit fraction ${(100*d.f).toFixed(1)}%`+(currentView().test?`\n${d.supported}/${d.eligible} samples with BH < 0.01`:'')}
function graphPanel(root,view,scope,x,width){const p=palette(),H=860,g=el('g',{transform:`translate(${x},0)`});root.append(g);text(g,width/2,34,scope.label,21,{'text-anchor':'middle','font-weight':'bold'});text(g,width/2,58,`${scope.indices.length} ${scope.indices.length===1?'sample':'samples'} · ${view.title}`,13,{'text-anchor':'middle',fill:p.muted});text(g,width/2,80,$('assay').selectedOptions[0].textContent+' · ≥'+D.identity+'/9 · ≥'+D.coverage+'% assay coverage',11,{'text-anchor':'middle',fill:p.muted});const nodes=view.nodes,indices=nodes.map((_,i)=>i).filter(i=>visible(nodes[i],scope.indices));const show=new Set(indices),r=i=>1.1+1.1*Math.sqrt(nodes[i].activeProteins||nodes[i].proteins.length);const xy=i=>[65+nodes[i].x*(width-130),100+nodes[i].y*(H-230)];let count=0;for(const[a,b,n,total,max]of view.links){if(max<Number($('weight').value)||!show.has(a)||!show.has(b))continue;const[u,v]=[xy(a),xy(b)];g.append(el('line',{x1:u[0],y1:u[1],x2:v[0],y2:v[1],stroke:p.link,'stroke-width':.25+Math.min(1.6,Math.log1p(total)/5),'stroke-opacity':.17}));count++;}for(const i of indices.sort((a,b)=>signal(nodes[a],scope.indices).f-signal(nodes[b],scope.indices).f)){const n=nodes[i],d=signal(n,scope.indices),[cx,cy]=xy(i);const circle=el('circle',{cx,cy,r:r(i),fill:color(d.f),stroke:d.supported?p.blue:p.muted,'stroke-opacity':d.supported?1:.4,'stroke-width':d.supported?1.3:.45,class:'svg-hit','data-node':i});circle.append(el('title',{},nodeTooltip(n,scope)));circle.onclick=()=>selectNode(i);g.append(circle);}const labels=indices.sort((a,b)=>(signal(nodes[b],scope.indices).f*Math.sqrt(nodes[b].proteins.length))-(signal(nodes[a],scope.indices).f*Math.sqrt(nodes[a].proteins.length))).slice(0,18),used=[];for(const i of labels){const[posx,posy]=xy(i),label=nodes[i].label.length>33?nodes[i].label.slice(0,30)+'…':nodes[i].label;let ly=posy-r(i)-6;if(used.some(([px,py])=>Math.abs(px-posx)<110&&Math.abs(py-ly)<15))continue;used.push([posx,ly]);text(g,posx,ly,label,11,{'text-anchor':'middle','font-weight':'bold',stroke:p.bg,'stroke-width':3,'paint-order':'stroke'});}text(g,width/2,H-102,`${indices.length.toLocaleString()} families · ${count.toLocaleString()} displayed sequence links`,13,{'text-anchor':'middle',fill:p.muted});drawKey(g,width/2,H-75,view.test);return H;}
function drawKey(g,x,y,test){const p=palette();for(let k=0;k<100;k++)g.append(el('rect',{x:x-150+k*1.65,y,width:1.7,height:9,fill:color(k/99*Number($('color-max').value))}));text(g,x-150,y+25,'0',11,{fill:p.muted});text(g,x+15,y+25,'≥'+(100*Number($('color-max').value))+'%',11,{'text-anchor':'end',fill:p.muted});text(g,x+40,y+8,'Mean Hit Fraction',12);if(test)text(g,x,y+46,(isOnt()?'Blue Arc':'Blue Outline')+' · ≥1 Sample BH < 0.01',12,{'text-anchor':'middle',fill:p.blue});}
function radialPanel(root,view,scope,x,width){
 const p=palette(),H=1240,g=el('g',{transform:`translate(${x},0)`});root.append(g);
 text(g,width/2,34,scope.label,22,{'text-anchor':'middle','font-weight':'bold'});
 text(g,width/2,59,`${scope.indices.length} ${scope.indices.length===1?'sample':'samples'} · ${view.title}`,14,{'text-anchor':'middle',fill:p.muted});
 text(g,width/2,81,$('assay').selectedOptions[0].textContent+' · ≥'+D.identity+'/9 · ≥'+D.coverage+'% assay coverage',11,{'text-anchor':'middle',fill:p.muted});
 const a=assay(),active=protein=>a.protein_h[protein].some(x=>x>0),nodes=view.nodes.map((n,i)=>({...n,index:i,active:n.proteins.filter(active)})).filter(n=>n.active.length);
 const total=nodes.reduce((v,n)=>v+Math.sqrt(n.active.length),0),cx=width/2,cy=590,R=350;
 let angle=-Math.PI/2,visibleCount=0;const labels=[];
 const pos=(r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)],arc=(r,lo,hi)=>{const a=pos(r,lo),b=pos(r,hi);return `M ${a} A ${r},${r} 0 ${hi-lo>Math.PI?1:0},1 ${b}`};
 for(const n of nodes){
  const span=(2*Math.PI-.008*nodes.length)*Math.sqrt(n.active.length)/total,lo=angle,hi=lo+span,mid=(lo+hi)/2,d=signal(n,scope.indices);
  if(visible(n,scope.indices)){
   visibleCount++;g.append(el('path',{d:arc(R,lo,hi),fill:'none',stroke:d.supported?p.blue:p.low,'stroke-width':d.supported?5:3,class:'svg-hit','data-node':n.index}));g.lastChild.onclick=()=>selectNode(n.index);
   for(let k=0;k<n.active.length;k++){
    const protein=n.active[k],pn={h:a.protein_h[protein],n:a.protein_n[protein]},f=signal(pn,scope.indices).f,t=lo+(k+.5)/n.active.length*span,u=pos(R+8,t),v=pos(R+10+80*f,t);
    g.append(el('line',{x1:u[0],y1:u[1],x2:v[0],y2:v[1],stroke:f?color(f):p.low,'stroke-width':Math.max(.45,Math.min(2,span*R/n.active.length*.8))}));
   }
   labels.push({n,d,mid,anchor:pos(R+94,mid),desired:pos(R+115,mid)[1],right:Math.cos(mid)>=0});
  }
  angle=hi+.008;
 }
 for(const right of [false,true]){
  const list=labels.filter(l=>l.right===right).sort((a,b)=>a.desired-b.desired),gap=15,top=130,bottom=1050;
  for(let i=0;i<list.length;i++)list[i].y=Math.max(list[i].desired,i?list[i-1].y+gap:top);
  if(list.at(-1)?.y>bottom){list.at(-1).y=bottom;for(let i=list.length-2;i>=0;i--)list[i].y=Math.min(list[i].y,list[i+1].y-gap);}
  for(const l of list){
   const end=cx+(right?520:-520),labelX=end+(right?7:-7),bend=cx+(right?490:-490);
   g.append(el('path',{d:`M ${l.anchor} L ${bend},${l.y} L ${end},${l.y}`,fill:'none',stroke:p.muted,'stroke-width':.6,'stroke-opacity':.6}));
   const t=text(g,labelX,l.y,l.n.label,11,{'text-anchor':right?'start':'end','dominant-baseline':'middle','font-weight':l.d.supported?'bold':'normal',fill:l.d.h?p.ink:p.muted});
   t.append(el('title',{},nodeTooltip(l.n,scope)));t.style.cursor='pointer';t.onclick=()=>selectNode(l.n.index);
  }
 }
 text(g,cx,cy-30,'Human Serome',24,{'text-anchor':'middle','font-weight':'bold'});
 text(g,cx,cy,view.title,17,{'text-anchor':'middle'});
 text(g,cx,cy+26,`${visibleCount} Categories`,13,{'text-anchor':'middle',fill:p.muted});
 text(g,cx,cy+52,'One Mark per Protein Membership',12,{'text-anchor':'middle',fill:p.muted});
 text(g,cx,cy+73,'Spike Height · Mean Mapped Hit Fraction',12,{'text-anchor':'middle',fill:p.muted});
 const annotated=new Set(view.nodes.flatMap(n=>n.proteins)),unannotated=a.protein_h.filter((v,i)=>v.some(x=>x>0)&&!annotated.has(i)).length;
 text(g,cx,H-103,`${unannotated.toLocaleString()} study-active proteins without a recorded category`,13,{'text-anchor':'middle',fill:p.muted});drawKey(g,cx,H-73,true);return H;
}
function drillPanel(root,view,scope,width){const p=palette(),node=view.nodes[S.drill],a=assay(),group=node.proteins,N=group.length,g=el('g');root.append(g);text(g,width/2,35,node.label,23,{'text-anchor':'middle','font-weight':'bold'});text(g,width/2,62,`${node.id} · ${N} reference proteins · ${scope.label}`,14,{'text-anchor':'middle',fill:p.muted});const present=group.filter(i=>$('quiet').checked||scope.indices.some(j=>a.protein_h[i][j]>0)),loc=new Map(present.map((i,k)=>[i,[width/2+300*Math.cos(2*Math.PI*k/present.length-Math.PI/2),430+300*Math.sin(2*Math.PI*k/present.length-Math.PI/2)]]));let links=0;for(const[a,b,w]of D.edges){if(!loc.has(a)||!loc.has(b)||w<Number($('weight').value))continue;const[u,v]=[loc.get(a),loc.get(b)];g.append(el('line',{x1:u[0],y1:u[1],x2:v[0],y2:v[1],stroke:p.link,'stroke-opacity':.25,'stroke-width':.4+2*w}));links++;}for(const i of present){const[x,y]=loc.get(i),d=signal({h:a.protein_h[i],n:a.protein_n[i]},scope.indices),circle=el('circle',{cx:x,cy:y,r:present.length>60?3:7,fill:color(d.f),stroke:p.blue,'stroke-width':.8});circle.append(el('title',{},D.records[i].gene+' · '+D.records[i].source+'\n'+D.records[i].description+`\n${d.h}/${d.n} hit/observed antigen–sample calls`));g.append(circle);if(present.length<=45){const dx=x-width/2,dy=y-430;text(g,x+dx*.09,y+dy*.09,D.records[i].gene||D.records[i].source,12,{'text-anchor':Math.abs(dx)<1?'middle':dx>0?'start':'end','dominant-baseline':'middle'});}}text(g,width/2,805,`${present.length} proteins · ${links} sequence links`,14,{'text-anchor':'middle',fill:p.muted});drawKey(g,width/2,836,false);return 900;}
function caption(){const scope=selectedScopes().map(s=>s.label).join(' / ');if(S.drill!=null)return `Within-family sequence matches · ${scope}. Nodes are canonical reference proteins; color shows the mean fraction of their mapped observed assay antigens called positive. Edges use harmonic residue coverage. A single antigen may support several proteins.`;if(isOnt())return `Human ${currentView().title.toLowerCase()} · ${scope}. Each radial mark is one study-active protein/category membership. Spike height and color show its mean per-sample mapped antigen hit fraction. Blue arcs mark categories with at least one selected sample passing BH < 0.01. Memberships overlap; categories are not additive.`;return `${currentView().title} · ${scope}. Circle size shows study-active reference proteins. Color shows mean per-sample hit / observed antigen fraction, using distinct antigen unions within each family. Lines are sequence similarities (maximum protein-link weight ≥ ${$('weight').value}); they are not observed cross-patient correlations. ${currentView().test?'Blue outlines indicate at least one selected sample with family enrichment BH < 0.01.':'Families were reclustered from hit-supported proteins; no enrichment p-values are assigned.'} Geometry is fixed within each view.`;}
function draw(){const view=currentView(),patient=$('view').value==='patient';$('layer-label').classList.toggle('hidden',!isOnt());$('example-label').classList.toggle('hidden',!patient);$('scope').parentElement.classList.toggle('hidden',patient);$('compare').parentElement.classList.toggle('hidden',patient);$('scope2').classList.toggle('hidden',patient||!$('compare').checked);$('weight-label').classList.toggle('hidden',isOnt());$('support-label').classList.toggle('hidden',!view.test);$('back').classList.toggle('hidden',S.drill==null);if(!view.test)$('support').checked=false;const scopes=selectedScopes(),width=isOnt()?1700:1100,fullWidth=S.drill==null?width*scopes.length:width,svg=el('svg',{xmlns:NS,viewBox:`0 0 ${fullWidth} 950`,role:'img','aria-label':view.title});svg.style.background=palette().bg;svg.append(el('rect',{width:fullWidth,height:isOnt()?1200:950,fill:palette().bg}));let height=0;if(S.drill!=null)height=drillPanel(svg,view,scopes[0],width);else for(let i=0;i<scopes.length;i++)height=Math.max(height,isOnt()?radialPanel(svg,view,scopes[i],i*width,width):graphPanel(svg,view,scopes[i],i*width,width));svg.setAttribute('viewBox',`0 0 ${fullWidth} ${height}`);svg.firstChild.setAttribute('height',height);$('figure').replaceChildren(svg);S.svg=svg;$('title').textContent=(S.drill!=null?'Family Detail':view.title)+' · '+$('assay').selectedOptions[0].textContent;$('legend').textContent=caption();rank();if(S.selected!=null)selectNode(S.selected);}
function rank(){const v=currentView(),scope=selectedScopes()[0];S.rows=v.nodes.map((n,i)=>({i,n,d:signal(n,scope.indices)})).filter(r=>visible(r.n,scope.indices)).sort((a,b)=>b.d.f-a.d.f||b.d.h-a.d.h);$('ranking').innerHTML=`<table><thead><tr><th>Family / Category</th><th class="num">Hit Fraction</th><th class="num">Hit / Observed</th>${v.test?'<th class="num">BH &lt; 0.01</th>':''}</tr></thead><tbody>${S.rows.slice(0,200).map(r=>`<tr data-node="${r.i}"><td>${esc(r.n.label)}</td><td class="num">${(100*r.d.f).toFixed(1)}%</td><td class="num">${r.d.h.toLocaleString()} / ${r.d.n.toLocaleString()}</td>${v.test?`<td class="num">${r.d.supported} / ${r.d.eligible}</td>`:''}</tr>`).join('')}</tbody></table><p>Showing ${Math.min(200,S.rows.length)} of ${S.rows.length.toLocaleString()} visible sets. CSV includes every visible set. Hit / observed counts sum antigen–sample calls across the selected samples.</p>`;$('ranking').querySelectorAll('[data-node]').forEach(tr=>tr.onclick=()=>selectNode(+tr.dataset.node));}
function selectNode(i){S.selected=i;const v=currentView(),n=v.nodes[i],a=assay(),scope=selectedScopes()[0],d=signal(n,scope.indices);$('details-title').textContent=n.label;const families=new Map(a.views[0].nodes.flatMap((n,i)=>n.proteins.map(p=>[p,{id:n.id,index:i}])));$('details').innerHTML=`<p><span class="detail-title">${esc(n.id)}</span> · ${n.proteins.length} reference proteins</p><p>${d.h.toLocaleString()} hit / ${d.n.toLocaleString()} observed antigen–sample calls · mean ${(100*d.f).toFixed(1)}%${v.test?`<br>Sample BH &lt; 0.01: ${d.supported}/${d.eligible}${scope.indices.length===1?' · p '+fmt(d.p)+' · BH '+fmt(d.q):''}`:''}</p>${!isOnt()?'<button id="inspect">Inspect Family</button>':''}<table><thead><tr><th>Protein</th><th class="num">Hit / Observed</th><th class="num">Assay Features</th><th>Sequence Family</th></tr></thead><tbody>${n.proteins.map(p=>{const r=D.records[p],q=signal({h:a.protein_h[p],n:a.protein_n[p]},scope.indices);return `<tr><td title="${esc(r.description)}">${esc(r.gene)} · ${esc(r.source)}</td><td class="num">${q.h} / ${q.n}</td><td class="num">${a.protein_features[p].length}</td><td>${families.has(p)?`<button data-family="${families.get(p).index}">${families.get(p).id}</button>`:'—'}</td></tr>`}).join('')}</tbody></table>`;$('details').querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{$('view').value='reference';S.drill=+b.dataset.family;draw();selectNode(S.drill)});if($('inspect'))$('inspect').onclick=()=>{S.drill=i;draw()};}
function search(){const query=$('search').value.trim().toLowerCase();if(!query){$('search-results').replaceChildren();return;}const matches=currentView().nodes.flatMap((n,i)=>n.label.toLowerCase().includes(query)||n.id.toLowerCase().includes(query)||n.proteins.some(p=>(D.records[p].gene+' '+D.records[p].source).toLowerCase().includes(query))?[[n,i]]:[]).slice(0,25);$('search-results').innerHTML=matches.map(([n,i])=>`<li><button data-node="${i}">${esc(n.label)} · ${n.proteins.length} proteins</button></li>`).join('');$('search-results').querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>selectNode(+b.dataset.node));}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
const fileBase=()=>[D.study,$('assay').value,$('view').value,selectedScopes()[0].label].join('_').replace(/[^a-zA-Z0-9_.-]/g,'_');
function serialized(){const s=S.svg.cloneNode(true);s.setAttribute('width',S.svg.viewBox.baseVal.width);s.setAttribute('height',S.svg.viewBox.baseVal.height);s.insertBefore(el('desc',{},caption()),s.firstChild);return new XMLSerializer().serializeToString(s)}
$('svg-export').onclick=()=>download(new Blob([serialized()],{type:'image/svg+xml'}),fileBase()+'.svg');
$('png-export').onclick=async()=>{const blob=new Blob([serialized()],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width*2;c.height=img.height*2;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>download(b,fileBase()+'.png'));URL.revokeObjectURL(url)};img.src=url};
$('csv').onclick=()=>{const cols=['view','assay','scope','node','label','proteins','hit_antigen_sample_calls','observed_antigen_sample_calls','mean_sample_hit_fraction','supported_samples','tested_samples','sample_p','sample_bh'],rows=[cols];for(const scope of selectedScopes())for(const n of currentView().nodes){if(!visible(n,scope.indices))continue;const d=signal(n,scope.indices);rows.push([currentView().id,$('assay').value,scope.label,n.id,n.label,n.proteins.length,d.h,d.n,d.f,d.supported,d.eligible,d.p,d.q]);}download(new Blob([rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),fileBase()+'.csv')};
for(const id of ['view','layer','scope','scope2','compare','weight','quiet','support','example','color-max'])$(id).onchange=()=>{if(['view','layer','example'].includes(id)){S.drill=null;S.selected=null;$('details').textContent='Select a family or annotation to inspect its proteins and evidence.';}draw();search();};
$('assay').onchange=()=>{S.drill=null;S.selected=null;$('details-title').textContent='Family Inspector';$('details').textContent='Select a family or annotation to inspect its proteins and recorded antigen evidence.';buildScopes();draw();search()};$('search').oninput=search;$('back').onclick=()=>{S.drill=null;draw()};$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light';draw()};
$('methods').onclick=()=>$('methods-dialog').showModal();$('close-methods').onclick=()=>$('methods-dialog').close();
$('methods-text').innerHTML=`<p>Reference families use the complete human–human MimicryMap graph at ≥${D.identity}/9 and ≥${D.coverage}% coverage on either side, weighted by the harmonic mean of both residue-coverage fractions. Markov clustering uses expansion 2, inflation 2, self loops of 1 and sparse pruning at 0.001. The number of groups is not prescribed. Weighted force layout is rank-spaced on each coordinate to prevent disconnected outliers from compressing the main network; geometric distances are not numerical similarity estimates.</p><p>Study-active families recluster the subgraph of human proteins supported by at least one mapped recorded hit across this study. Sample-active examples repeat this within the first participant in each study group at each visit. Their labels and positions are local to that partition. Reference and study-active geometry stays fixed when switching displayed samples.</p><p>HuProt membership uses the existing ≥${D.identity}/9, ≥${D.coverage}% assay-antigen coverage mapping. A reference protein can receive evidence from several features; a single feature can map to several proteins. Each set counts the union of recorded antigen IDs once. IgG and IgA remain separate. Only biological samples with platform data are included, using the installed hit and observed-call masks.</p><p>Fixed reference families and annotation categories use one-sided hypergeometric enrichment against all retained observed assay antigens in each sample. BH correction includes all measured sets in that collection before display filtering. Group selections display sample evidence, not an independent group-test p-value. Active-derived families receive no p-values because their membership was selected using the same hits.</p><p>HPA categories join canonical reference gene labels. Molecular function, protein class and primary cellular location are separate overlapping collections; no artificial parent–child hierarchy is imposed. The radial view repeats protein memberships where the recorded annotations overlap. These are sequence-supported evidence summaries, not validated antibody specificities or empirically estimated co-reactivity correlations.</p>`;
options('assay',Object.keys(D.assays).map(p=>[p,p==='HuProt_635nm'?'HuProt (IgG)':'HuProt (IgA)']));$('study').textContent=D.study+' · ≥'+D.identity+'/9 · ≥'+D.coverage+'% · Recorded Hit Calls';buildScopes();draw();
window.review={draw,serialized,selectNode,data:D,state:S};
</script></body></html>
