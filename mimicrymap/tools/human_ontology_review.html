<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Ontology Atlas</title>
<style>
:root{color-scheme:dark;--bg:#0d1420;--panel:#162130;--ink:#e2e9f1;--muted:#9aaabd;--border:#304157;--blue:#5196d9;--teal:#29ad9e;--low:#28394b;--link:#536880}
body.light{color-scheme:light;--bg:#faf8f2;--panel:#fff;--ink:#17212d;--muted:#657380;--border:#d4dbdf;--blue:#347db6;--teal:#087f76;--low:#dbe5e8;--link:#9faeb7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}header{padding:18px 24px 12px;background:var(--panel);border-bottom:1px solid var(--border)}h1{font-size:21px;font-weight:600;margin:0 0 5px}header p{margin:0;color:var(--muted)}a{color:var(--blue)}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--border)}label{display:flex;align-items:center;gap:7px;color:var(--muted)}select,button,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:5px 9px}select{max-width:330px}button{cursor:pointer}button:hover{border-color:var(--blue)}input[type=checkbox]{accent-color:var(--blue)}main{padding:14px 24px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:15px}.toolbar h2{margin:0;font-size:18px;font-weight:600}.exports{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap}.exports button{padding:3px 5px;border:0;background:transparent;color:var(--blue);font-weight:500}.figure-wrap{overflow:auto;border:1px solid var(--border);border-radius:6px}.figure-wrap svg{display:block;width:100%;min-width:950px;height:auto}.legend{max-width:1180px;text-align:center;margin:12px auto;color:var(--muted);line-height:1.5}.bottom{display:grid;grid-template-columns:minmax(450px,1fr) minmax(450px,1fr);gap:16px}.box{background:var(--panel);padding:16px;border:1px solid var(--border);border-radius:6px;max-height:580px;overflow:auto}h3{font-size:17px;margin:0 0 10px}p{line-height:1.5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:7px;border-bottom:1px solid var(--border)}.num{text-align:center}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:var(--low)}.muted,small{color:var(--muted)}.hidden{display:none!important}.search-results{max-height:250px;overflow:auto}.search-results button{display:block;text-align:left;margin:4px 0;width:100%}.node{cursor:pointer}.node:hover{stroke:var(--ink)!important;stroke-width:2!important}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--border);border-radius:7px;max-width:850px;max-height:85vh;overflow:auto;padding:24px}dialog::backdrop{background:#0009}pre{white-space:pre-wrap;font:14px/1.6 Inter,system-ui,sans-serif}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chips button{font-size:12px;padding:5px}.family-button{padding:3px 5px;text-align:left}.headlink{float:right}.tabrow{display:flex;gap:7px;margin-bottom:12px}@media(max-width:1000px){.bottom{grid-template-columns:1fr}main{padding:10px}}
</style></head><body>
<header><a class="headlink" href="../index.html">Sequence Assembly →</a><h1>Human Ontology Atlas</h1><p id="study">Loading retained study evidence…</p></header>
<div class="controls"><label>Ontology <select id="aspect"><option value="molecular_function">Molecular Function</option><option value="biological_process">Biological Process</option><option value="cellular_component">Cellular Location</option></select></label><label>Assay <select id="assay"></select></label><label>Samples <select id="scope"></select></label><label><input type="checkbox" id="compare"> Compare</label><select id="scope2" aria-label="Second sample selection"></select></div>
<div class="controls"><button id="home">← Ontology Overview</button><label>Color Maximum <select id="color-max"><option value=".05">5%</option><option value=".1">10%</option><option value=".25" selected>25%</option><option value=".5">50%</option><option value="1">100%</option></select></label><label><input id="labels" type="checkbox" checked> Labels</label><input id="search" placeholder="Find a GO term or gene…" aria-label="Find a GO term or gene"><button id="theme">Light</button><button id="methods">Methods</button></div>
<main><div class="toolbar"><h2 id="title">Ontology Overview</h2><div class="exports">Export: <button id="csv">CSV</button><button id="svg-export">SVG</button><button id="png-export">PNG</button></div></div><div class="figure-wrap" id="figure"></div><div class="legend" id="legend"></div><div class="bottom"><section class="box"><h3 id="inspector-title">Term Inspector</h3><div class="search-results" id="search-results"></div><div id="inspector"></div></section><section class="box"><div class="tabrow"><button id="terms-tab">Term Evidence</button><button id="families-tab">Sequence Families</button></div><div id="table"></div></section></div></main>
<dialog id="methods-dialog"><button id="close-methods" style="float:right">Close</button><h2>Methods</h2><pre id="methods-text"></pre><a href="README.txt">Complete Methods &amp; Export Definitions</a></dialog>
<script src="serome-palette.js"></script><script src="serome-style.js"></script><script src="ontology-figure.js"></script>
<script src="ontology-data.js"></script><script>
const D=ONTOLOGY_DATA,$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const S={focus:null,svg:null,visible:[],scopes:[],table:'terms',family:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>x==null?'—':x<.0001?x.toExponential(2):x.toPrecision(3),pct=x=>(x*100).toFixed(1)+'%';
const assay=()=>D.assays[$('assay').value],root=()=>D.aspects[$('aspect').value].root;
const node=i=>D.nodes[i],scope=id=>S.scopes.find(s=>s.id===$(id).value),scopes=()=>[scope('scope'),...($('compare').checked?[scope('scope2')]:[])];
function el(tag,attrs={},value){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(value!=null)e.textContent=value;return e}
function palette(){const c=SeroMapPlotPalette.colors({mode:S.figureMode||(document.body.classList.contains('light')?'light':'dark')});return {bg:c.bg,panel:c.surface,ink:c.ink,muted:c.muted,border:c.line,blue:c.sharingGroup,teal:c.private,low:c.cellNull,link:c.faint};}
function txt(g,x,y,value,size=13,attrs={}){const e=el('text',{x,y,fill:palette().ink,'font-family':FIGURE_FONT,'font-size':size,...attrs},value);g.append(e);return e}
function blend(a,b,t){const x=a.slice(1).match(/../g).map(v=>parseInt(v,16)),y=b.slice(1).match(/../g).map(v=>parseInt(v,16));return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function color(v){const p=palette();return blend(p.low,p.blue,Math.sqrt(Math.max(0,Math.min(1,v/Number($('color-max').value)))))}
function options(id,rows){$(id).replaceChildren(...rows.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o}))}
function buildScopes(){const a=assay(),old=[$('scope').value,$('scope2').value];S.scopes=[{id:'all',label:'Whole Study',indices:a.samples.map((s,i)=>i)}];for(const g of [...new Set(a.samples.map(s=>s.group))]){S.scopes.push({id:'g:'+g,label:g+' · All Visits',indices:a.samples.flatMap((s,i)=>s.group===g?[i]:[])});for(const v of [...new Set(a.samples.map(s=>s.visit))])S.scopes.push({id:'gv:'+g+':'+v,label:g+' · '+v,indices:a.samples.flatMap((s,i)=>s.group===g&&s.visit===v?[i]:[])});}for(let i=0;i<a.samples.length;i++)S.scopes.push({id:'s:'+a.samples[i].id,label:a.samples[i].id,indices:[i]});for(const[id,k]of[['scope',0],['scope2',1]]){options(id,S.scopes.map(s=>[s.id,s.label]));$(id).value=S.scopes.some(s=>s.id===old[k])?old[k]:S.scopes.filter(s=>s.id.startsWith('gv:'))[k?2:0]?.id||'all';}}
function signal(i,sc){const e=assay().evidence;let h=0,n=0,f=0,count=0,supported=0;for(const j of sc.indices){h+=e.h[i][j];n+=e.n[i][j];if(e.n[i][j]){f+=e.h[i][j]/e.n[i][j];count++;}if(e.q[i][j]!=null&&e.q[i][j]<.01)supported++;}return {h,n,f:count?f/count:0,count,supported,p:sc.indices.length===1?e.p[i][sc.indices[0]]:null,q:sc.indices.length===1?e.q[i][sc.indices[0]]:null};}
function proteinSignal(i,sc){const a=assay();let value=0,n=0;for(const j of sc.indices)if(a.protein_n[i][j]){value+=a.protein_h[i][j]/a.protein_n[i][j];n++;}return n?value/n:0;}
function makeHierarchy(){const base=S.focus??root(),overview=S.focus==null,children=new Map();if(overview){D.nodes.forEach((n,i)=>{if(n.aspect!==$('aspect').value||!n.overview)return;for(const p of n.overviewParents){if(!children.has(p))children.set(p,[]);children.get(p).push(i);}});}else children.set(base,node(base).children);
 function build(i,depth=0){const kids=(children.get(i)||[]).slice().sort((a,b)=>node(a).label.localeCompare(node(b).label));const item={i,depth,children:kids.map(j=>build(j,depth+1))};item.weight=item.children.length?item.children.reduce((a,b)=>a+b.weight,0):Math.sqrt(node(i).proteins.length);return item;}
 const tree=build(base);if(!tree.children.length)tree.children=[{i:base,depth:1,children:[],weight:tree.weight}];let max=1;function allocate(t,lo,hi){t.lo=lo;t.hi=hi;max=Math.max(max,t.depth);let angle=lo;for(const child of t.children){const span=(hi-lo)*child.weight/t.children.reduce((a,b)=>a+b.weight,0);allocate(child,angle,angle+span);angle+=span;}}allocate(tree,-Math.PI/2,Math.PI*1.5);tree.maxDepth=max;return tree;}
function focus(i){S.focus=i;S.family=null;S.table='terms';$('aspect').value=node(i).aspect;draw();}
function inspector(){const i=S.focus??root(),n=node(i),d=signal(i,scope('scope'));$('inspector-title').textContent=displayTerm(i);$('inspector').innerHTML=`<p><a href="https://amigo.geneontology.org/amigo/term/${n.id}" target="_blank" rel="noreferrer">${n.id} ↗</a> · ${n.proteins.length.toLocaleString()} reference proteins</p><p>${d.h.toLocaleString()} / ${d.n.toLocaleString()} hit / observed antigen–sample calls · mean hit fraction ${pct(d.f)}.<br>${d.supported} / ${d.count} samples with BH &lt; 0.01${d.q!=null?' · p '+fmt(d.p)+' · BH '+fmt(d.q):''}</p><div class="chips">${n.parents.map(([p,r])=>`<button data-parent="${p}">↑ ${esc(node(p).label)} · ${r.replace('_',' ')}</button>`).join('')}</div><p class="muted">${n.children.length} immediate GO children. Select a sector or term to inspect it; Sequence Families shows the proteins belonging to both this term and each saved family.</p>`;for(const b of $('inspector').querySelectorAll('[data-parent]'))b.onclick=()=>focus(Number(b.dataset.parent));}
function table(){if(S.table==='families'){familyTable();return;}const ss=scopes(),rows=S.visible.map(i=>({i,d:signal(i,ss[0])})).sort((a,b)=>b.d.supported-a.d.supported||b.d.f-a.d.f||node(a.i).label.localeCompare(node(b.i).label));$('table').innerHTML=`<table><thead><tr><th>GO Term</th><th class="num">Proteins</th>${ss.map(s=>`<th class="num">${esc(s.label)}<br><small>Hit Fraction · Supported / Tested</small></th>`).join('')}</tr></thead><tbody>${rows.map(({i})=>`<tr data-id="${i}"><td>${esc(node(i).label)}<br><small>${node(i).id}</small></td><td class="num">${node(i).proteins.length}</td>${ss.map(s=>{const d=signal(i,s);return `<td class="num">${pct(d.f)}<br><small>${d.supported} / ${d.count}${s.indices.length===1?' · BH '+fmt(d.q):''}</small></td>`}).join('')}</tr>`).join('')}</tbody></table>`;for(const r of $('table').querySelectorAll('[data-id]'))r.onclick=()=>focus(Number(r.dataset.id));}
function familyTable(){const members=new Set(node(S.focus??root()).proteins),sc=scope('scope'),families=D.families.map(f=>({...f,inside:f.proteins.filter(p=>members.has(p))})).filter(f=>f.inside.length).map(f=>({...f,mean:f.inside.reduce((a,p)=>a+proteinSignal(p,sc),0)/f.inside.length})).sort((a,b)=>b.mean-a.mean||b.inside.length-a.inside.length);if(S.family){const f=families.find(f=>f.id===S.family);if(f){$('table').innerHTML=`<button id="back-families">← ${families.length} Families</button><h3 style="margin-top:12px">${esc(f.label)}</h3><p class="muted">${f.id} · ${f.inside.length} of ${f.proteins.length} family proteins in this term.</p><table><thead><tr><th>Protein</th><th class="num">Mapped Hit Fraction</th></tr></thead><tbody>${f.inside.map(p=>`<tr><td><strong>${esc(D.records[p].gene)}</strong> · ${esc(D.records[p].source)}<br><small>${esc(D.records[p].description)}</small></td><td class="num">${pct(proteinSignal(p,sc))}</td></tr>`).join('')}</tbody></table>`;$('back-families').onclick=()=>{S.family=null;familyTable()};return;}}
 $('table').innerHTML=`<p>${families.length.toLocaleString()} reference sequence families intersect this term.</p><table><thead><tr><th>Sequence Family</th><th class="num">In Term / Family</th><th class="num">Mean Protein<br>Hit Fraction</th></tr></thead><tbody>${families.map(f=>`<tr><td><button class="family-button" data-family="${f.id}">${esc(f.label)}</button><br><small>${f.id}</small></td><td class="num">${f.inside.length} / ${f.proteins.length}</td><td class="num">${pct(f.mean)}</td></tr>`).join('')}</tbody></table>`;for(const b of $('table').querySelectorAll('[data-family]'))b.onclick=()=>{S.family=b.dataset.family;familyTable()};}
function search(){const q=$('search').value.trim().toLowerCase();if(q.length<2){$('search-results').replaceChildren();return;}const matches=D.nodes.map((n,i)=>({n,i})).filter(({n})=>n.aspect===$('aspect').value&&(n.id.toLowerCase().includes(q)||n.label.toLowerCase().includes(q))).slice(0,30);const proteins=D.records.flatMap((r,i)=>r.gene.toLowerCase()===q||r.source.toLowerCase()===q?[i]:[]);if(proteins.length)for(let i=0;i<D.nodes.length;i++){const n=node(i);if(n.overview&&n.aspect===$('aspect').value&&proteins.some(p=>n.proteins.includes(p))&&!matches.some(x=>x.i===i))matches.push({n,i});}$('search-results').innerHTML=matches.slice(0,45).map(({n,i})=>`<button data-search="${i}">${esc(n.label)} <small>${n.id}</small></button>`).join('');for(const b of $('search-results').querySelectorAll('button'))b.onclick=()=>{focus(Number(b.dataset.search));$('search-results').replaceChildren()};}
function serialized(live=false){return new XMLSerializer().serializeToString(buildFigure(live?undefined:'light').svg);}
function download(content,name,type){const blob=content instanceof Blob?content:new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function stem(){return 'Human_Ontology_'+$('assay').value+'_'+$('aspect').value+(S.focus==null?'_Overview':'_'+node(S.focus).id.replace(':','_'));}
function csv(){const header=['assay','aspect','term','label','panel','sample','group','visit','hit_antigens','observed_mapped_antigens','p','bh','bh_family','identity','assay_coverage'],rows=[header],a=assay();for(const sc of scopes())for(const i of S.visible)for(const j of sc.indices){const s=a.samples[j];rows.push([$('assay').value,$('aspect').value,node(i).id,node(i).label,sc.label,s.id,s.group,s.visit,a.evidence.h[i][j],a.evidence.n[i][j],a.evidence.p[i][j],a.evidence.q[i][j],'All measured terms in GO aspect per assay/sample',D.identity,D.coverage]);}return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');}
async function png(live=false){const url=URL.createObjectURL(new Blob([serialized(live)],{type:'image/svg+xml'})),img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=document.createElement('canvas');c.width=img.width*1.5;c.height=img.height*1.5;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/png');}
options('assay',Object.keys(D.assays).map(k=>[k,k.endsWith('635nm')?'HuProt (IgG)':'HuProt (IgA)']));buildScopes();$('study').textContent=D.study+' · Human Swiss-Prot · '+D.ontology_version.replace('releases/','GO ');$('assay').onchange=()=>{buildScopes();draw()};$('aspect').onchange=()=>{S.focus=null;S.family=null;$('search-results').replaceChildren();draw()};for(const id of ['scope','scope2','compare','color-max','labels'])$(id).onchange=draw;$('home').onclick=()=>{S.focus=null;S.family=null;draw()};$('theme').onclick=()=>{document.body.classList.toggle('light');$('theme').textContent=document.body.classList.contains('light')?'Dark':'Light';draw()};$('search').oninput=search;$('terms-tab').onclick=()=>{S.table='terms';table()};$('families-tab').onclick=()=>{S.table='families';S.family=null;table()};$('svg-export').onclick=()=>download(serialized(),stem()+'.svg','image/svg+xml');$('png-export').onclick=async()=>{const a=document.createElement('a');a.href=await png();a.download=stem()+'.png';a.click()};$('csv').onclick=()=>download(csv(),stem()+'.csv','text/csv');$('methods').onclick=async()=>{$('methods-dialog').showModal();try{$('methods-text').textContent=await(await fetch('README.txt')).text()}catch{$('methods-text').textContent=caption()}};$('close-methods').onclick=()=>$('methods-dialog').close();Promise.all([document.fonts.load('400 10px Inter'),document.fonts.load('700 9px Inter')]).then(draw);window.ontology={state:S,draw,serialized,png,csv,focus,signal,data:D};
</script></body></html>
