" y="191" font-size="19" font-weight="400" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">required number of identical positions.</text><text x="1080" y="101" font-size="29" font-weight="700" fill="#246099" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→</text><text x="1260" y="30" font-size="20" font-weight="700" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">4  Map Context</text><svg viewBox="0 0 160 76" aria-hidden="true" x="1180" y="54" width="160" height="76"><defs><marker id="summaryMapArrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="summary-arrowhead" d="M1 1L7 4L1 7" fill="none" stroke="#172434" stroke-width="1.4" /></marker></defs><path class="summary-outline" d="M10 13h140 M10 41h52 M62 55h60 M8 69h144" fill="none" stroke="#246099" stroke-width="2" /><g class="summary-context-extensions"><rect class="summary-context-box" x="56" y="7" width="18" height="12" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="92" y="7" width="18" height="12" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="17" y="36" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="41" y="36" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="67" y="50" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="91" y="50" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="116" y="64" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /><rect class="summary-context-box" x="140" y="64" width="12" height="10" fill="#246099" fill-opacity=".15" stroke="#246099" /></g><path class="summary-core-box" d="M74 7h18v12