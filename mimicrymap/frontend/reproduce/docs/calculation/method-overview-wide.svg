<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="239" viewBox="0 0 1800 239" font-family="Arial, Helvetica, sans-serif"><title>MimicryMap in five steps</title><rect x="0" y="0" width="1800" height="239" fill="white" stroke="none" stroke-width="1" /><text x="180" y="30" font-size="20" font-weight="700" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1  Select Records</text><svg viewBox="0 0 160 76" aria-hidden="true" x="100" y="54" width="160" height="76"><rect class="summary-outline" x="4" y="22" width="52" height="26" rx="2" fill="none" stroke="#246099" stroke-width="2" /><text x="71" y="40" font-family="Courier New, monospace" font-size="14" fill="#172434">×</text><path class="summary-outline" d="M104 16h44v30 M99 21h44v30 M94 26h44v30H94z" fill="none" stroke="#246099" stroke-width="2" /></svg><text x="180" y="166" font-size="19" font-weight="400" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Choose one target record and the</text><text x="180" y="191" font-size="19" font-weight="400" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">parent records to compare with it.</text><text x="360" y="101" font-size="29" font-weight="700" fill="#246099" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">→</text><text x="540" y="30" font-size="20" font-weight="700" fill="#172434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2  Extract Window Pairs</text><svg viewBox="0 0 160 76" aria-hidden="true" x="460" y="54" width="160" height="76"><path class="summary-outline" d="M8 12h144" fill="none" stroke="#246099" stroke-width="2" /><rect class="summary-fill" x="10" y="27" width="18" height="5" fill="#246099" fill-opacity=".35" /><rect class="summary-fill" x="12" y="37" width="18" height="5" fill="#246099" fill-opacity=".35" /><rect class="summary-fill" x="14" y="47" width="18" height="5" fill="#246099" fill-opacity=".35" /><rect class="summary-fil